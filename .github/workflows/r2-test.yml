name: Test credenciales R2

# Diagnóstico rápido (~30 s): verifica que los secrets R2 funcionan listando
# el bucket, sin correr el pipeline completo. Lanzar a mano cuando se roten
# las credenciales.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Listar bucket con las credenciales de los secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Secrets R2 no configurados"; exit 1
          fi
          echo "longitud del Access Key ID: ${#AWS_ACCESS_KEY_ID} (debe ser 32)"
          if ! aws s3 ls s3://monitor-terremoto-media/ \
            --endpoint-url https://fe26e2674ce7e3cdf6b07397be7ee8e8.r2.cloudflarestorage.com \
            > /tmp/ls.txt 2> /tmp/err.txt; then
            echo "::error::Credenciales R2 inválidas: $(cat /tmp/err.txt)"; exit 1
          fi
          echo "✅ Credenciales válidas — objetos en el bucket: $(wc -l < /tmp/ls.txt)"
