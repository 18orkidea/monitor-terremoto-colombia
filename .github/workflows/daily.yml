name: Monitor diario

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC ≈ 05:30 Colombia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-diario
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Corrida diaria (solo stdlib, sin dependencias)
        run: python ingest/run_daily.py

      - name: Tests de hipótesis contra los datos frescos
        run: |
          python -m unittest tests.test_unit -v
          python -m unittest tests.test_hipotesis -v

      - name: Commit del snapshot si hay cambios
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -m "snapshot $(date -u +%F): actualización diaria"
            git push
          fi

      # Requiere el secret CLOUDFLARE_API_TOKEN (permiso: Cloudflare Pages - Edit).
      # Sin el secret, este paso se salta y el sitio simplemente no se redespliega.
      - name: Desplegar a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          ./deploy/build_dist.sh
          npx --yes wrangler@4 pages deploy dist \
            --project-name monitor-terremoto-colombia --branch main
        # wrangler lee CLOUDFLARE_API_TOKEN del entorno:
        # (el token nunca aparece en el repo; solo en Settings → Secrets)
