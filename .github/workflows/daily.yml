name: Monitor diario

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC ≈ 05:30 Colombia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-diario
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # node ejecuta la regla del balance, que vive en site/ui.js (R14). La
      # imagen del runner ya lo trae, pero sin fijar versión: si un día
      # desapareciera, alerts.py degradaría y dejaría de publicar la cifra.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # run_daily sale 1 si CUALQUIER fuente falló, y eso abortaba el job antes
      # de commitear: el 17-ago-2026 un HTTP 502 pasajero del DANE costó los
      # snapshots de las otras doce fuentes (2 archivados ese día, frente a 70
      # del anterior). R13 dice que un feed caído no rompe la corrida; el
      # archivo se guarda primero y el rojo se pone al final.
      - name: Corrida diaria (solo stdlib, sin dependencias)
        id: corrida
        continue-on-error: true
        run: python ingest/run_daily.py

      # Archivo permanente de videos ciudadanos (ChatMap no garantiza retención).
      # Requiere secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (token S3 de R2,
      # solo bucket monitor-terremoto-media). Sin ellos, se salta.
      - name: Archivar videos ciudadanos en R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws s3 sync data/media/ s3://monitor-terremoto-media/ \
            --endpoint-url https://fe26e2674ce7e3cdf6b07397be7ee8e8.r2.cloudflarestorage.com \
            --exclude "*" --include "*.mp4" --include "*.mov" --include "*.webm" \
            --include "*.opus" --include "*.ogg" --include "*.m4a" --size-only

      # Copia independiente en la Wayback Machine de las fuentes más frágiles
      # (nadie archivaba el RUD durante la semana del sismo; que no vuelva a
      # pasar). La Wayback ratelimita, así que aquí va solo lo que NO queda
      # archivado en data/snapshots/: los ficheros de UNOSAT que no son
      # geometría —el informe del epicentro, único análisis de San José del
      # Palmar, del que no se publican vectores, y la tabla de exposición de
      # población— salen de la base para no fijarlos a mano. No fatal.
      - name: Archivar fuentes frágiles en Wayback
        run: |
          # Las dos URLs de cada producto: su página en SERTIT y el mapa
          # público en el portal de la Charter. Un SELECT roto NO puede
          # confundirse con «no hay filas»: sin este aviso, el arreglo de
          # Wayback puede llevar meses sin ejecutarse y figurar como hecho.
          SERTIT=$(sqlite3 data/monitor.sqlite \
            "SELECT url_producto FROM sertit_productos WHERE url_producto IS NOT NULL
             UNION SELECT url_mapa FROM sertit_productos WHERE url_mapa IS NOT NULL;") \
            || echo "::warning::consulta de URLs de SERTIT rota: nada suyo irá a Wayback"
          UNOSAT=$(sqlite3 data/monitor.sqlite \
            "SELECT pdf_url FROM unosat_products WHERE pdf_url IS NOT NULL
             UNION SELECT xlsx_url FROM unosat_products WHERE xlsx_url IS NOT NULL;" \
            2>/dev/null || true)
          for url in \
            "https://rud.gestiondelriesgo.gov.co/home/json.php?temp=2026T" \
            "https://chatmap.hotosm.org/api/v1/map/89319bbb-a14a-4dfd-b9a1-c83b8b55785f" \
            "https://monitor-terremoto-colombia-oficiales-ai.inforesidencias.workers.dev/oficiales.json" \
            "https://sertit.unistra.fr/cartographie-rapide/cartoaction/845/" \
            $UNOSAT $SERTIT; do
            curl -sS -m 90 -o /dev/null "https://web.archive.org/save/${url}" \
              || echo "::warning::Wayback save falló hoy para ${url}"
            sleep 10
          done

      # El feed de balances vive en el KV de un worker externo: si el worker
      # muere, la serie desaparece. Snapshot diario al repo para que todo lo
      # publicado sea reconstruible solo desde git. No fatal.
      - name: Snapshot del feed de balances
        run: |
          HOY=$(date -u +%F)
          DEST="feeds/balances/${HOY}.json"
          # misma política intradía que data/snapshots/: un cuerpo distinto el
          # mismo día se archiva aparte, jamás pisa al anterior. El fichero del
          # 17-ago es la frontera del cambio de criterio de atribución y está
          # citado como evidencia en docs/DECISIONES.md.
          if [ -e "$DEST" ]; then
            DEST="feeds/balances/${HOY}T$(date -u +%H%M%S).json"
          fi
          if curl -sS -m 60 -f \
              "https://monitor-terremoto-colombia-oficiales-ai.inforesidencias.workers.dev/oficiales.json" \
              -o "$DEST"; then
            sha256sum "$DEST"
          else
            echo "::warning::El feed de balances no respondió hoy; sin snapshot"
            rm -f "$DEST"
          fi

      # ORDEN DELIBERADO: las imágenes se regeneran AQUÍ, antes de los tests y
      # dentro del commit del día. No lo muevas al deploy: allí ya corría, pero
      # su resultado no se commiteaba, así que el fichero versionado se quedaba
      # atrás y el test que lo vigila suspendía cada mañana — y ese suspenso
      # apagaba la publicación entera (23 y 24-ago-2026, dos días sin web con
      # los datos ya archivados). Regenerar la cifra a mano cerró el aviso un
      # día y volvió al siguiente: el bucle sólo se rompe generando aquí.
      # No fatal (R13): sin Pillow se sigue con los PNG versionados.
      - name: Regenerar las imágenes sociales antes de juzgarlas
        continue-on-error: true
        run: |
          pip install --quiet pillow && python3 deploy/gen_og.py \
            || echo "::warning::OG no regeneradas hoy; el test de la imagen compartida puede avisar"

      - name: Commit del snapshot si hay cambios
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ feeds/balances/ site/og/
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -m "snapshot $(date -u +%F): actualización diaria"
            git push
          fi

      # Avisos del día (Web Push + Telegram) vía el worker de push, con el
      # alerts.json fresco en el body (no espera al deploy de Pages). El
      # dedupe del worker hace esto idempotente con su cron de respaldo de
      # las 11:20 UTC. Sin el secret, se salta limpio. No fatal (R13).
      # ---- verificaciones, DESPUÉS de archivar ----
      # Un supuesto roto o una hipótesis caída son noticia (R11/R12), no motivo
      # para perder el día. En pr.yml siguen siendo fatales, que es donde duele
      # sin coste de archivo.
      - name: Tests de hipótesis contra los datos frescos
        id: hipotesis
        continue-on-error: true
        run: |
          python -m unittest tests.test_unit -v
          python -m unittest tests.test_hipotesis -v

      - name: Vigilar los contratos de las fuentes externas (no fatal)
        continue-on-error: true
        run: |
          python -m unittest tests.test_supuestos_api -v \
            || echo "::warning::Algún supuesto sobre una fuente externa cambió — revisar la salida"

      - name: Vigilar las reglas que viven en JavaScript (no fatal)
        continue-on-error: true
        run: |
          python -m unittest tests.test_frontend tests.test_worker_toponimos -v \
            || echo "::error::Las reglas en JavaScript fallaron — revisar antes del próximo deploy del worker"

      - name: Avisar por push y Telegram (no fatal)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_INTERNAL_TOKEN }}
        if: ${{ env.PUSH_TOKEN != '' }}
        continue-on-error: true
        run: |
          curl -sS -m 60 -X POST \
            -H "Authorization: Bearer ${PUSH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/public/alerts.json \
            https://monitor-terremoto-colombia-push.inforesidencias.workers.dev/internal/enviar \
            || echo "::warning::El envío de avisos falló hoy (el cron del worker reintenta a las 11:20 UTC)"

      # El deploy lo hace "Deploy GitHub Pages" (workflow_run tras esta corrida).
      # La vía Cloudflare Pages se eliminó el 16-ago: el dominio apunta a GitHub
      # Pages y publicar por dos caminos divergía (ver docs/DECISIONES.md).

      # R11/R12: una hipótesis caída AVISA, no rompe — y puede ser buena
      # noticia. El comentario de más arriba ya lo decía mientras estas líneas
      # hacían lo contrario: hasta el 24-ago-2026 un solo test de datos en rojo
      # tumbaba la corrida entera, y pages.yml sólo despliega tras un
      # `workflow_run` en verde. Resultado: los días 23 y 24 el archivo se
      # guardó entero y la web se quedó congelada en el 22, sin que nadie
      # hubiera decidido eso.
      #
      # La distinción es la que importa, y son dos cosas distintas:
      #   - la CORRIDA falló  ⇒ puede no haber día que publicar: rojo y alto.
      #   - una HIPÓTESIS cayó ⇒ el archivo está entero: se anota y se publica.
      # El rojo por hipótesis sigue vivo donde duele sin coste de archivo: en
      # pr.yml, tal y como dice el comentario del bloque de verificaciones.
      - name: Anotar la hipótesis caída sin apagar la publicación
        if: steps.hipotesis.outcome == 'failure'
        run: |
          echo "::error::Una hipótesis cayó con los datos frescos. El día SÍ se archivó y la web SÍ se publica: revisar el resumen de la corrida — que una hipótesis caiga puede ser buena noticia (R12)."
          {
            echo "### Una hipótesis cayó con los datos de hoy"
            echo ""
            echo "Los tests contra los datos frescos fallaron. **El archivo del día está completo y la publicación sigue su curso** (R11/R12)."
            echo "Revisar la salida del paso «Tests de hipótesis contra los datos frescos»."
          } >> "$GITHUB_STEP_SUMMARY"

      # El rojo llega aquí, con el día ya archivado: se ve el fallo sin perder
      # el snapshot. Si esto salta, mirar el RESUMEN de la corrida más arriba.
      - name: Marcar la corrida en rojo si el día no se pudo archivar
        if: steps.corrida.outcome == 'failure'
        run: |
          echo "::error::La corrida diaria falló (${{ steps.corrida.outcome }}): el día puede haber quedado sin archivar, así que tampoco se publica. Revisar el resumen de fuentes."
          exit 1
