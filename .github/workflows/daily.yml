name: Monitor diario

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC ≈ 05:30 Colombia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-diario
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Corrida diaria (solo stdlib, sin dependencias)
        run: python ingest/run_daily.py

      - name: Tests de hipótesis contra los datos frescos
        run: |
          python -m unittest tests.test_unit -v
          python -m unittest tests.test_hipotesis -v

      # Archivo permanente de videos ciudadanos (ChatMap no garantiza retención).
      # Requiere secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (token S3 de R2,
      # solo bucket monitor-terremoto-media). Sin ellos, se salta.
      - name: Archivar videos ciudadanos en R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws s3 sync data/media/ s3://monitor-terremoto-media/ \
            --endpoint-url https://fe26e2674ce7e3cdf6b07397be7ee8e8.r2.cloudflarestorage.com \
            --exclude "*" --include "*.mp4" --include "*.mov" --include "*.webm" \
            --include "*.opus" --include "*.ogg" --include "*.m4a" --size-only

      # Copia independiente del RUD en la Wayback Machine (nadie lo archivaba
      # durante la semana del sismo; que no vuelva a pasar). No fatal.
      - name: Archivar RUD en Wayback
        run: |
          curl -sS -m 90 -o /dev/null \
            "https://web.archive.org/save/https://rud.gestiondelriesgo.gov.co/home/json.php?temp=2026T" \
            || echo "::warning::Wayback save falló hoy"

      # El feed de balances vive en el KV de un worker externo: si el worker
      # muere, la serie desaparece. Snapshot diario al repo para que todo lo
      # publicado sea reconstruible solo desde git. No fatal.
      - name: Snapshot del feed de balances
        run: |
          HOY=$(date -u +%F)
          if curl -sS -m 60 -f \
              "https://monitor-terremoto-colombia-oficiales-ai.inforesidencias.workers.dev/oficiales.json" \
              -o "feeds/balances/${HOY}.json"; then
            sha256sum "feeds/balances/${HOY}.json"
          else
            echo "::warning::El feed de balances no respondió hoy; sin snapshot"
            rm -f "feeds/balances/${HOY}.json"
          fi

      - name: Commit del snapshot si hay cambios
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/ feeds/balances/
          if git diff --cached --quiet; then
            echo "Sin cambios hoy."
          else
            git commit -m "snapshot $(date -u +%F): actualización diaria"
            git push
          fi

      # El deploy lo hace "Deploy GitHub Pages" (workflow_run tras esta corrida).
      # La vía Cloudflare Pages se eliminó el 16-ago: el dominio apunta a GitHub
      # Pages y publicar por dos caminos divergía (ver docs/DECISIONES.md).
