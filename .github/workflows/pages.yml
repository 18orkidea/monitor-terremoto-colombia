name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static artifact
        run: |
          mkdir -p dist/site dist/data dist/data/media
          cp -R site/. dist/site/
          cp -R data/public dist/data/public
          # fotos ciudadanas (solo imágenes; los videos no están en el repo)
          find data/media -maxdepth 1 \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' \) \
            -size -25M -exec cp {} dist/data/media/ \; 2>/dev/null || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
