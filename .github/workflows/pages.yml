name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # el commit diario lo hace el bot con GITHUB_TOKEN y ese push NO dispara
  # workflows (anti-recursión de GitHub); workflow_run sí se entera
  workflow_run:
    workflows: ["Monitor diario"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerar imágenes sociales (no fatal)
        run: |
          pip install --quiet pillow && python3 deploy/gen_og.py || \
            echo "::warning::OG no regeneradas; se usan las versionadas"

      - name: Build static artifact
        run: |
          mkdir -p dist/site dist/data dist/data/media
          cp -R site/. dist/site/
          cp -R data/public dist/data/public
          # fotos ciudadanas (solo imágenes; los videos no están en el repo)
          find data/media -maxdepth 1 \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' \) \
            -size -25M -exec cp {} dist/data/media/ \; 2>/dev/null || true
          touch dist/.nojekyll
          # robots.txt + llms.txt + sitemap en la raíz del dominio
          cp deploy/root/* dist/
          HOY=$(date -u +%F)
          cat > dist/sitemap.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://brechas.orkidea.eu/site/</loc><changefreq>daily</changefreq><lastmod>$HOY</lastmod><priority>1.0</priority></url>
            <url><loc>https://brechas.orkidea.eu/site/noticias.html</loc><changefreq>daily</changefreq><lastmod>$HOY</lastmod><priority>0.8</priority></url>
            <url><loc>https://brechas.orkidea.eu/site/balances.html</loc><changefreq>daily</changefreq><lastmod>$HOY</lastmod><priority>0.8</priority></url>
          </urlset>
          XML
          sed -i 's/^          //' dist/sitemap.xml
          # raíz del dominio → /site/ (redirección relativa: vale para
          # brechas.orkidea.eu y para 18orkidea.github.io/monitor-…/)
          printf '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./site/"><title>Monitor de brechas</title></head><body><a href="./site/">Ir al monitor</a></body></html>' > dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
