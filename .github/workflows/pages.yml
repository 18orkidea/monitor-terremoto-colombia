name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # el commit diario lo hace el bot con GITHUB_TOKEN y ese push NO dispara
  # workflows (anti-recursión de GitHub); workflow_run sí se entera
  workflow_run:
    workflows: ["Monitor diario"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # tras el daily solo se despliega si la corrida terminó bien — antes se
    # redesplegaba también tras corridas fallidas
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerar imágenes sociales (no fatal)
        run: |
          pip install --quiet pillow && python3 deploy/gen_og.py || \
            echo "::warning::OG no regeneradas; se usan las versionadas"

      # un solo build para todo: deploy/build_dist.sh es la definición del artefacto
      - name: Build static artifact
        run: ./deploy/build_dist.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
