name: Tests de PR

# Nada llega a main sin tests. Sin test_supuestos_api aquí: depende de red
# externa y un PR no debe fallar porque una API ajena tosa (eso lo vigila el
# daily, donde avisar es el objetivo).
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (unit + hipótesis; la BD se reconstruye desde dumps)
        run: |
          python ingest/dump_db.py rebuild
          python -m unittest tests.test_unit tests.test_hipotesis tests.test_webpush -v

      # El artefacto se construye AQUÍ, ANTES de la suite que lo mide — y aquí
      # `seo_check` sí bloquea. Hasta el 30-ago-2026 este paso iba DESPUÉS de
      # "Tests de lo que se publica": los cinco guardianes que leen `dist/`
      # (TestGraficoRud, TestSeoCheck, TestInventarioDelPie,
      # TestBarraYPieUnaSolaVez, TestLaPaginaDeReferencia) se saltaban SIEMPRE
      # en cada PR —`dist/` está en .gitignore, así que sin construirlo antes
      # esos tests no tenían nada que mirar—, y un guardián que se salta solo
      # en la única superficie donde tenía que morder no es un guardián. Lo
      # cazó el alta de OPS, al negarse a aceptar cinco skips sin nombre
      # (docs/DECISIONES.md, 30-ago-2026). `_requiere_dist()` en
      # `test_render_html.py` es el blindaje contra que esto se repita: si
      # `dist/` no existe, esos tests FALLAN en CI en vez de saltarse.
      #
      # En el despliegue (`pages.yml`) `seo_check` va con `continue-on-error`
      # a propósito, porque publicar tarde es peor que publicar con un aviso
      # (R11). La división sigue siendo deliberada: en un PR se revisa
      # CÓDIGO —una pieza que deja de escribirse es un error nuestro y tiene
      # que doler—; en el despliegue manda el dato del día, que no se le
      # puede exigir a nadie.
      - name: El artefacto se construye y se mide (aquí el suelo de prosa sí bloquea)
        run: |
          # Pillow, como en `pages.yml` y `daily.yml`: `build_dist.sh` genera
          # las imágenes de portada y sin ella se cae con ModuleNotFoundError.
          # No contradice R14 —el runtime sigue sin dependencias—: esto es una
          # dev-tool de CI, igual que ruff. Faltaba solo aquí, así que el PR
          # construía distinto de lo que se publica, y esa diferencia es
          # exactamente la clase de cosa que este paso viene a cazar.
          pip install --quiet pillow
          bash deploy/build_dist.sh
          python3 ingest/seo_check.py dist

      # Los guardianes de lo que se PUBLICA —fichas, tabla de portada,
      # llms-full.txt— solo corrían en local. El día que la portada anunció un
      # total satelital que su propia tabla desmentía, en CI no falló nada.
      # Corre DESPUÉS del paso de arriba: cinco de estos tests leen `dist/`.
      - name: Tests de lo que se publica (fichas, tablas y ficheros de descubrimiento)
        run: python -m unittest tests.test_render_html -v

      # Las reglas que viven en JavaScript (R8 en ui.js, R10 en el worker) se
      # vigilaban solo con node --check, que no ejecuta nada: sin estos, la
      # paridad entre las dos listas de municipios era un guardián apagado.
      - name: Tests de la lógica en JavaScript (ejecutan el código real con node)
        run: python -m unittest tests.test_frontend tests.test_worker_toponimos -v

      - name: Lint Python (ruff, solo en CI — el runtime sigue sin dependencias)
        run: |
          pip install --quiet ruff==0.6.9
          ruff check .

      # OJO: `node --check` sobre un .js que contiene `export` detecta módulo y
      # devuelve 0 aunque la sintaxis esté rota (verificado con node 20). Los
      # ESM se comprueban copiados a .mjs, donde sí valida.
      - name: Sintaxis JavaScript (node --check, cero dependencias)
        run: |
          for f in site/*.js; do
            node --check "$f"
          done
          for f in workers/*/src/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
