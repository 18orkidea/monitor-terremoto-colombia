name: Tests de PR

# Nada llega a main sin tests. Sin test_supuestos_api aquí: depende de red
# externa y un PR no debe fallar porque una API ajena tosa (eso lo vigila el
# daily, donde avisar es el objetivo).
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (unit + hipótesis; la BD se reconstruye desde dumps)
        run: |
          python ingest/dump_db.py rebuild
          python -m unittest tests.test_unit tests.test_hipotesis tests.test_webpush -v

      # Los guardianes de lo que se PUBLICA —fichas, tabla de portada,
      # llms-full.txt— solo corrían en local. El día que la portada anunció un
      # total satelital que su propia tabla desmentía, en CI no falló nada.
      - name: Tests de lo que se publica (fichas, tablas y ficheros de descubrimiento)
        run: python -m unittest tests.test_render_html -v

      # Las reglas que viven en JavaScript (R8 en ui.js, R10 en el worker) se
      # vigilaban solo con node --check, que no ejecuta nada: sin estos, la
      # paridad entre las dos listas de municipios era un guardián apagado.
      - name: Tests de la lógica en JavaScript (ejecutan el código real con node)
        run: python -m unittest tests.test_frontend tests.test_worker_toponimos -v

      # El artefacto se construye AQUÍ, y aquí `seo_check` sí bloquea. En el
      # despliegue (`pages.yml`) va con `continue-on-error` a propósito, porque
      # publicar tarde es peor que publicar con un aviso (R11) — pero eso dejaba
      # el suelo de prosa sin morder en ningún camino automático: `dist/` está
      # en .gitignore, así que sin construirlo los tests que lo miran se saltan
      # solos y un guardián que se salta solo no es un guardián.
      #
      # La división es deliberada: en un PR se revisa CÓDIGO —una pieza que deja
      # de escribirse es un error nuestro y tiene que doler—; en el despliegue
      # manda el dato del día, que no se le puede exigir a nadie.
      - name: El artefacto se construye y se mide (aquí el suelo de prosa sí bloquea)
        run: |
          bash deploy/build_dist.sh
          python3 ingest/seo_check.py dist

      - name: Lint Python (ruff, solo en CI — el runtime sigue sin dependencias)
        run: |
          pip install --quiet ruff==0.6.9
          ruff check .

      # OJO: `node --check` sobre un .js que contiene `export` detecta módulo y
      # devuelve 0 aunque la sintaxis esté rota (verificado con node 20). Los
      # ESM se comprueban copiados a .mjs, donde sí valida.
      - name: Sintaxis JavaScript (node --check, cero dependencias)
        run: |
          for f in site/*.js; do
            node --check "$f"
          done
          for f in workers/*/src/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
